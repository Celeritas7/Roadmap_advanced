<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · C — Master detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ui:'Hanken Grotesk',system-ui,sans-serif;--display:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--role-h:18;--canvas:#fcf7f3;--panel:#fff;--panel-2:#f6f6f3;--ink:#16181d;--ink-2:#565a63;--ink-3:#9a9ea7;--ink-4:#c6c9d0;--rule:#ecece8;--rule-strong:#dedfda;--hover:rgba(20,22,28,.04);--accent:hsl(var(--role-h) 62% 50%);--accent-soft:hsl(var(--role-h) 62% 55% / .12);--accent-ink:hsl(var(--role-h) 52% 40%);--on-accent:#fff;--rad:14px;--rad-sm:9px;--shadow-pop:0 20px 60px rgba(16,18,29,.18),0 0 0 1px rgba(16,18,29,.05)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--canvas);background-image:radial-gradient(135% 62% at 50% -8%,hsl(var(--role-h) 65% 52% / .14),transparent 60%);display:grid;place-items:center;padding:24px}
.scrim{position:fixed;inset:0;background:rgba(22,24,29,.34)}
.modal{position:relative;width:min(1020px,100%);height:min(650px,calc(100dvh - 48px));display:flex;flex-direction:column;background:var(--panel);border-radius:var(--rad);box-shadow:var(--shadow-pop);overflow:hidden}
.bar{display:flex;align-items:center;gap:4px;padding:0 18px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
.bar h1{margin:0 16px 0 0;font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.tab{padding:14px 12px;font-family:var(--ui);font-size:13px;color:var(--ink-3);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.bar .who{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.split{flex:1;display:grid;grid-template-columns:268px 1fr;min-height:0}
.list{display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--panel-2);min-height:0}
.list-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 9px}
.list-h span{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.add-s{font-size:12px;font-weight:600;color:var(--accent-ink);background:none;border:0;cursor:pointer}
.items{flex:1;overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;background:none;border:0;border-radius:var(--rad-sm);cursor:pointer;text-align:left}
.item:hover{background:var(--hover)}
.item.on{background:var(--panel);box-shadow:0 1px 2px rgba(16,18,29,.06)}
.swatch{width:22px;height:22px;border-radius:6px;flex:none}
.item .n{font-size:13.5px;font-weight:600;color:var(--ink)}
.item .s{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.state{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:2px 6px;border-radius:4px}
.state.off{color:var(--ink-3);background:var(--rule)}
.ed{display:flex;flex-direction:column;min-width:0}
.ed-h{display:flex;align-items:center;gap:12px;padding:18px 24px 14px;border-bottom:1px solid var(--rule)}
.big{width:38px;height:38px;border-radius:10px;flex:none}
.ed-h h2{margin:0;font-family:var(--display);font-size:18px;letter-spacing:-.01em}
.ed-h p{margin:2px 0 0;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.seg{margin-left:auto;display:inline-flex;gap:1px;padding:2px;background:var(--canvas);border:1px solid var(--rule-strong);border-radius:7px}
.seg button{padding:4px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:none;border:0;border-radius:5px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--accent-ink)}
.ed-b{flex:1;overflow-y:auto;padding:18px 24px 24px;display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp>h3{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
label.k{font-size:11.5px;color:var(--ink-2)}
.in{width:100%;padding:8px 10px;font-family:var(--ui);font-size:13.5px;color:var(--ink);background:var(--panel-2);border:1px solid var(--rule-strong);border-radius:var(--rad-sm);outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.range{display:flex;align-items:center;gap:8px}
.range .in{font-family:var(--mono);font-size:12.5px;text-align:center;padding:8px 6px}
.range span{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--rule-strong);border-radius:99px;cursor:pointer}
.chip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.sw{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
.track{width:34px;height:19px;border-radius:99px;background:var(--rule-strong);position:relative;flex:none;cursor:pointer}
.track.on{background:var(--accent)}
.track i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff}
.track.on i{left:17px}
.hues{display:flex;gap:5px}
.hue{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.hue.on{border-color:var(--ink)}
.owns{display:flex;flex-wrap:wrap;gap:6px}
.p{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:12.5px;background:var(--panel-2);border:1px solid var(--rule-strong);border-radius:99px}
.p i{width:8px;height:8px;border-radius:50%;display:block}
.danger{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.danger p{margin:0;font-size:12px;color:var(--ink-3);line-height:1.45}
.btn{padding:8px 15px;font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--rule-strong);border-radius:var(--rad-sm);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.btn.warn{color:#a3222b;border-color:rgba(200,40,50,.3);background:rgba(200,40,50,.06)}
.foot{display:flex;align-items:center;gap:10px;padding:13px 24px;border-top:1px solid var(--rule);background:var(--panel-2)}
.dirty{font-size:12.5px;color:var(--ink-3);margin-right:auto}
.restore{font-size:12px;color:var(--accent-ink);background:none;border:0;border-bottom:1px solid transparent;cursor:pointer}
.restore:hover{border-bottom-color:currentColor}
a{color:var(--accent-ink)}a:hover{color:var(--accent)}
</style></head><body>
<div class="scrim"></div>
<div class="modal">
  <div class="bar">
    <h1>Settings</h1>
    <button class="tab">Account</button>
    <button class="tab">Appearance</button>
    <button class="tab on">Roles &amp; tiers</button>
    <button class="tab">Projects</button>
    <button class="tab">Schedule</button>
    <span class="who">wf@example.com</span>
  </div>
  <div class="split">
    <aside class="list">
      <div class="list-h"><span>3 roles</span><button class="add-s">+ Add</button></div>
      <div class="items">
        <button class="item on"><span class="swatch" style="background:hsl(18 62% 50%)"></span><span><span class="n">Attackers</span><br><span class="s">09:00–19:00 · 4</span></span><span class="state">auto</span></button>
        <button class="item"><span class="swatch" style="background:hsl(158 62% 50%)"></span><span><span class="n">Mid-players</span><br><span class="s">19:00–21:00 · 2</span></span><span class="state">auto</span></button>
        <button class="item"><span class="swatch" style="background:hsl(252 62% 50%)"></span><span><span class="n">Defenders</span><br><span class="s">21:00–23:00 · 2</span></span><span class="state off">off</span></button>
      </div>
    </aside>
    <section class="ed">
      <div class="ed-h">
        <div class="big" style="background:hsl(18 62% 50%)"></div>
        <div><h2>Attackers</h2><p>FWD · id attackers</p></div>
        <div class="seg"><button class="on">auto</button><button>on</button><button>off</button></div>
      </div>
      <div class="ed-b">
        <div class="grp"><h3>Identity</h3><div class="two">
          <div class="f"><label class="k">Label</label><input class="in" value="Attackers"></div>
          <div class="f"><label class="k">Subtitle</label><input class="in" value="ambitions"></div>
          <div class="f wide"><label class="k">Mood line</label><input class="in" value="Push your ambitions forward"></div>
          <div class="f"><label class="k">Badge</label><input class="in" value="FWD"></div>
          <div class="f"><label class="k">Colour</label><div class="hues"><span class="hue on" style="background:hsl(18 62% 50%)"></span><span class="hue" style="background:hsl(158 62% 50%)"></span><span class="hue" style="background:hsl(252 62% 50%)"></span><span class="hue" style="background:hsl(200 62% 50%)"></span><span class="hue" style="background:hsl(320 62% 50%)"></span></div></div>
        </div></div>
        <div class="grp"><h3>When it runs</h3><div class="two">
          <div class="f"><label class="k">Weekday window</label><div class="range"><input class="in" value="09:00"><span>to</span><input class="in" value="19:00"></div></div>
          <div class="f"><label class="k">Weekend</label><div class="sw"><span class="track"><i></i></span>Runs on weekends</div></div>
          <div class="f wide"><label class="k">Locations</label><div class="chips"><span class="chip on">home</span><span class="chip on">office</span><span class="chip on">train</span></div></div>
        </div></div>
        <div class="grp"><h3>Projects in this role</h3><div class="owns">
          <span class="p"><i style="background:hsl(18 62% 50%)"></i>DX Engineer</span>
          <span class="p"><i style="background:hsl(220 62% 50%)"></i>Fullstack</span>
          <span class="p"><i style="background:hsl(138 62% 50%)"></i>Languages</span>
          <span class="p"><i style="background:hsl(200 62% 50%)"></i>Visa</span>
        </div></div>
        <div class="danger"><p>Deleting <b>Attackers</b> reassigns its 4 projects to a role you choose.</p><button class="btn warn">Delete role</button></div>
      </div>
    </section>
  </div>
  <div class="foot"><span class="dirty">3 unsaved changes</span><button class="restore">Restore defaults</button><button class="btn">Cancel</button><button class="btn pri">Save</button></div>
</div>
</body></html>
